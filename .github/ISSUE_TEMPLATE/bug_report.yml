name: 🐛 Сообщить об ошибке
description: Сообщить о баге или проблеме в игре
title: "[BUG] "
labels: ["bug"]
assignees:
  - Wichrisen

body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что помогаешь улучшать игру! Пожалуйста, заполни форму как можно подробнее.

  - type: input
    id: version
    attributes:
      label: Версия игры
      description: Какая версия игры у тебя установлена?
      placeholder: "v0.1.0-test"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Описание проблемы
      description: Что происходит? Что ты ожидал?
      placeholder: "При попытке открыть меню апгрейдов игра вылетает с ошибкой..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Шаги для воспроизведения
      description: Как повторить баг?
      placeholder: |
        1. Запустить игру
        2. Дойти до уровня Рейтисурда 8
        3. Открыть меню апгрейдов...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
      description: Что должно было произойти?

  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: Что происходит на самом деле?

  - type: textarea
    id: logs
    attributes:
      label: Логи / Сообщения об ошибках
      description: Если есть ошибки в консоли или логах — вставь их сюда.

  - type: textarea
    id: additional
    attributes:
      label: Дополнительная информация
      description: Скриншоты, видео, система (Windows 10/11?), и т.д.