name: Build Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release (instead of draft)'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    runs-on: windows-2022   # Pinned for stability (avoids sudden runner changes)
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller packaging/chaos_profit.spec

      - name: Prepare artifacts
        id: prepare
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="manual-${{ github.sha }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          mv dist "ChaosProfit-$VERSION"

          # Create portable ZIP
          7z a -tzip "ChaosProfit-$VERSION-portable.zip" "./ChaosProfit-$VERSION/*"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChaosProfit-${{ steps.prepare.outputs.version }}
          path: |
            ChaosProfit-${{ steps.prepare.outputs.version }}/
            ChaosProfit-${{ steps.prepare.outputs.version }}-portable.zip
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ github.event.inputs.create_release != 'true' }}
          prerelease: false
          generate_release_notes: true
          files: |
            ChaosProfit-${{ steps.prepare.outputs.version }}/
            ChaosProfit-${{ steps.prepare.outputs.version }}-portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
